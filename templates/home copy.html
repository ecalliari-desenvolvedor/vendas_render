<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Bem-vindo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            border: none;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }
        .card-body {
            padding: 50px;
        }
        .btn {
            padding: 12px 40px;
            font-size: 16px;
            font-weight: bold;
        }
        .btn-login {
            background-color: #667eea;
            border-color: #667eea;
        }
        .btn-login:hover {
            background-color: #5568d3;
            border-color: #5568d3;
        }
        .btn-cadastro {
            background-color: #764ba2;
            border-color: #764ba2;
        }
        .btn-cadastro:hover {
            background-color: #63408a;
            border-color: #63408a;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body text-center">
                        <h1 class="card-title mb-4">Bem-vindo!</h1>
                        <p class="card-text text-muted mb-5">Faça login ou crie sua conta para continuar</p>
                        
                        <div class="d-grid gap-3">
                            <a href="{{ url_for('login') }}" class="btn btn-primary btn-login btn-lg">
                                <i class="bi bi-box-arrow-in-right"></i> Login
                            </a>
                            <a href="{{ url_for('adicionar') }}" class="btn btn-primary btn-cadastro btn-lg">
                                <i class="bi bi-person-plus"></i> Cadastro
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

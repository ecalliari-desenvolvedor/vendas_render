services:
  - type: web
    name: app-vendas
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 app:app
    plan: free
    region: oregon
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: ecalliari@gmail.com
      - key: SMTP_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        value: admin@sistema.local
      - key: ADMIN_SENHA
        sync: false
